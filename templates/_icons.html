{# Inline stroke icons — no icon-font dependency, themeable via currentColor. #}
{% macro icon(name, size=18) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'home' -%}
  <path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 21 9 13 15 13 15 21"/>
{%- elif name == 'upload' -%}
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 9 12 4 17 9"/><line x1="12" y1="4" x2="12" y2="16"/>
{%- elif name == 'chat' -%}
  <path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-7a8 8 0 0 1 8-8h2a8 8 0 0 1 8 4z"/>
{%- elif name == 'graph' -%}
  <circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/>
  <line x1="8" y1="7" x2="15.5" y2="7.8"/><line x1="7.5" y1="8" x2="11" y2="15.8"/><line x1="16.5" y1="10" x2="13" y2="15.8"/>
{%- elif name == 'quiz' -%}
  <path d="M9 9a3 3 0 1 1 4.5 2.6c-.9.6-1.5 1.2-1.5 2.4"/><circle cx="12" cy="18" r=".6" fill="currentColor"/>
  <rect x="4" y="3" width="16" height="18" rx="3"/>
{%- elif name == 'target' -%}
  <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/>
{%- elif name == 'chart' -%}
  <path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-4"/><path d="M13 16V8"/><path d="M18 16v-7"/>
{%- elif name == 'sun' -%}
  <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5 3.6 3.6M20.4 20.4 19 19M19 5l1.4-1.4M3.6 20.4 5 19"/>
{%- elif name == 'moon' -%}
  <path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>
{%- elif name == 'book' -%}
  <path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M8 3v18"/>
{%- elif name == 'sparkles' -%}
  <path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.4 2.4M15.3 15.3l2.4 2.4M17.7 6.3l-2.4 2.4M8.7 15.3l-2.4 2.4"/>
{%- elif name == 'file' -%}
  <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/>
{%- elif name == 'slides' -%}
  <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/>
{%- elif name == 'video' -%}
  <rect x="2" y="5" width="14" height="14" rx="3"/><path d="m16 10 6-3v10l-6-3z"/>
{%- elif name == 'check' -%}
  <polyline points="4 12.5 9 17.5 20 6.5"/>
{%- elif name == 'x' -%}
  <path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == 'alert' -%}
  <path d="M12 3 2 20h20z"/><line x1="12" y1="10" x2="12" y2="14"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>
{%- elif name == 'shield' -%}
  <path d="M12 3 5 6v6c0 4 3 7.5 7 9 4-1.5 7-5 7-9V6z"/><polyline points="9 12 11.5 14.5 15.5 10"/>
{%- elif name == 'play' -%}
  <circle cx="12" cy="12" r="9"/><polygon points="10 8.5 16 12 10 15.5" fill="currentColor" stroke="none"/>
{%- elif name == 'arrow-right' -%}
  <line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/>
{%- elif name == 'refresh' -%}
  <path d="M21 12a9 9 0 1 1-2.6-6.4"/><polyline points="21 3 21 9 15 9"/>
{%- elif name == 'send' -%}
  <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>
{%- elif name == 'layers' -%}
  <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
{%- elif name == 'database' -%}
  <ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
{%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>
{%- elif name == 'bolt' -%}
  <polygon points="13 2 4 14 11 14 10 22 20 9 13 9"/>
{%- elif name == 'key' -%}
  <circle cx="8" cy="15" r="4"/><path d="m10.5 12.5 8-8M16 6l3 3M18 4l2 2"/>
{%- else -%}
  <circle cx="12" cy="12" r="9"/>
{%- endif -%}
</svg>
{%- endmacro %}
